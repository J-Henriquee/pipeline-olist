<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="620" fill="#0f1117"/>

  <text x="600" y="40" text-anchor="middle" fill="#f5f5f5" font-size="24" font-weight="bold">
    E-commerce Olist — Data Pipeline Architecture
  </text>
  <text x="600" y="64" text-anchor="middle" fill="#9a9a9a" font-size="13">
    Medallion Architecture (Bronze → Silver → Gold) · ELT approach
  </text>

  <!-- Source -->
  <rect x="30" y="140" width="150" height="90" rx="10" fill="#1e2130" stroke="#3a3f55" stroke-width="1.5"/>
  <text x="105" y="178" text-anchor="middle" fill="#e5e5e5" font-size="14" font-weight="bold">Kaggle</text>
  <text x="105" y="198" text-anchor="middle" fill="#9a9a9a" font-size="11">Olist Dataset</text>
  <text x="105" y="213" text-anchor="middle" fill="#9a9a9a" font-size="11">9 raw CSV files</text>

  <!-- Arrow -->
  <line x1="180" y1="185" x2="230" y2="185" stroke="#5a5f75" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="205" y="175" text-anchor="middle" fill="#7a7f95" font-size="10">upload_to_s3.py</text>

  <!-- Bronze -->
  <rect x="230" y="120" width="190" height="130" rx="10" fill="#3d2b1f" stroke="#CD7F32" stroke-width="2"/>
  <text x="325" y="148" text-anchor="middle" fill="#e8b98a" font-size="14" font-weight="bold">BRONZE</text>
  <text x="325" y="168" text-anchor="middle" fill="#e5e5e5" font-size="12">Amazon S3</text>
  <text x="325" y="186" text-anchor="middle" fill="#9a9a9a" font-size="11">/raw/olist/</text>
  <text x="325" y="204" text-anchor="middle" fill="#9a9a9a" font-size="11">Raw CSV, untouched</text>
  <text x="325" y="222" text-anchor="middle" fill="#9a9a9a" font-size="11">Data Lake</text>

  <!-- Arrow -->
  <line x1="420" y1="185" x2="470" y2="185" stroke="#5a5f75" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="445" y="175" text-anchor="middle" fill="#7a7f95" font-size="10">PySpark</text>

  <!-- Silver -->
  <rect x="470" y="120" width="190" height="150" rx="10" fill="#2c2e33" stroke="#C0C0C0" stroke-width="2"/>
  <text x="565" y="148" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">SILVER</text>
  <text x="565" y="168" text-anchor="middle" fill="#e5e5e5" font-size="12">Amazon S3</text>
  <text x="565" y="186" text-anchor="middle" fill="#9a9a9a" font-size="11">/silver/</text>
  <text x="565" y="204" text-anchor="middle" fill="#9a9a9a" font-size="11">Parquet, cleaned</text>
  <text x="565" y="222" text-anchor="middle" fill="#9a9a9a" font-size="11">Nulls, duplicates,</text>
  <text x="565" y="238" text-anchor="middle" fill="#9a9a9a" font-size="11">type casting handled</text>

  <!-- Arrow -->
  <line x1="660" y1="195" x2="710" y2="195" stroke="#5a5f75" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="685" y="185" text-anchor="middle" fill="#7a7f95" font-size="10">COPY</text>

  <!-- Gold -->
  <rect x="710" y="110" width="220" height="180" rx="10" fill="#3a3320" stroke="#D4AF37" stroke-width="2"/>
  <text x="820" y="138" text-anchor="middle" fill="#e8d67a" font-size="14" font-weight="bold">GOLD</text>
  <text x="820" y="158" text-anchor="middle" fill="#e5e5e5" font-size="12">Redshift Serverless</text>
  <text x="820" y="176" text-anchor="middle" fill="#9a9a9a" font-size="11">Star Schema</text>
  <text x="820" y="196" text-anchor="middle" fill="#c9c9c9" font-size="11">fato_vendas</text>
  <text x="820" y="212" text-anchor="middle" fill="#9a9a9a" font-size="10">dim_pedidos · dim_produtos</text>
  <text x="820" y="226" text-anchor="middle" fill="#9a9a9a" font-size="10">dim_clientes · dim_vendedores</text>
  <text x="820" y="240" text-anchor="middle" fill="#9a9a9a" font-size="10">dim_tempo · dim_avaliacoes</text>
  <text x="820" y="254" text-anchor="middle" fill="#9a9a9a" font-size="10">dim_pagamentos</text>
  <text x="820" y="274" text-anchor="middle" fill="#7a7f95" font-size="9">SQL DDL + INSERT (ELT)</text>

  <!-- Arrow to dashboard -->
  <line x1="930" y1="195" x2="980" y2="195" stroke="#5a5f75" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="955" y="185" text-anchor="middle" fill="#7a7f95" font-size="10">SQL</text>

  <!-- Dashboard -->
  <rect x="980" y="150" width="180" height="90" rx="10" fill="#1e2130" stroke="#3a3f55" stroke-width="1.5"/>
  <text x="1070" y="182" text-anchor="middle" fill="#e5e5e5" font-size="13" font-weight="bold">Streamlit</text>
  <text x="1070" y="200" text-anchor="middle" fill="#9a9a9a" font-size="11">Dashboard</text>
  <text x="1070" y="217" text-anchor="middle" fill="#9a9a9a" font-size="10">Business queries</text>

  <!-- Bottom row: data quality note -->
  <rect x="230" y="320" width="660" height="90" rx="10" fill="#181a22" stroke="#2a2d3a" stroke-width="1"/>
  <text x="560" y="345" text-anchor="middle" fill="#c9c9c9" font-size="12" font-weight="bold">Data Quality checks applied per table (Silver layer)</text>
  <text x="560" y="367" text-anchor="middle" fill="#8a8fa0" font-size="10.5">
    Null profiling · Duplicate detection · Business-logic filters (e.g. "delivered" status requires a delivery date)
  </text>
  <text x="560" y="385" text-anchor="middle" fill="#8a8fa0" font-size="10.5">
    Category translation (PT→EN) · Financial sanity checks · String standardization (trim/case)
  </text>
  <text x="560" y="403" text-anchor="middle" fill="#8a8fa0" font-size="10.5">
    No imputation — nulls that represent real business states (e.g. "not yet delivered") are preserved
  </text>

  <!-- Legend -->
  <text x="230" y="470" fill="#7a7f95" font-size="10.5">Extract: Python + boto3</text>
  <text x="230" y="488" fill="#7a7f95" font-size="10.5">Transform: PySpark (Bronze → Silver) + SQL (Silver → Gold, ELT)</text>
  <text x="230" y="506" fill="#7a7f95" font-size="10.5">Load: Redshift COPY command (parallel, columnar Parquet)</text>
  <text x="230" y="524" fill="#7a7f95" font-size="10.5">Serve: Streamlit dashboard, direct SQL connection via SQLAlchemy</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5a5f75"/>
    </marker>
  </defs>
</svg>
